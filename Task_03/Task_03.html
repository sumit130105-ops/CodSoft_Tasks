<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Adding a bit of custom CSS for the button press effect */
        .calc-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4 font-sans text-gray-800">

    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-xs border border-gray-100">
        
        <!-- Calculator Display -->
        <div class="bg-gray-100 rounded-xl mb-6 p-4 text-right shadow-inner flex flex-col justify-end min-h-[5rem] overflow-hidden">
            <div id="previous-operand" class="text-gray-500 text-sm h-5 overflow-hidden"></div>
            <div id="current-operand" class="text-4xl font-semibold text-gray-800 overflow-hidden break-all">0</div>
        </div>

        <div class="grid grid-cols-4 gap-3">
            <!-- First Row -->
            <button class="calc-btn col-span-3 bg-red-100 text-red-600 hover:bg-red-200 font-bold py-3 rounded-xl transition duration-150" data-action="clear">C</button>
            <button class="calc-btn bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold text-xl py-3 rounded-xl transition duration-150" data-action="operator">÷</button>

            <!-- Second Row -->
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">7</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">8</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">9</button>
            <button class="calc-btn bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold text-xl py-3 rounded-xl transition duration-150" data-action="operator">×</button>

            <!-- Third Row -->
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">4</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">5</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">6</button>
            <button class="calc-btn bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold text-xl py-3 rounded-xl transition duration-150" data-action="operator">-</button>

            <!-- Fourth Row -->
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">1</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">2</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">3</button>
            <button class="calc-btn bg-indigo-100 text-indigo-600 hover:bg-indigo-200 font-bold text-xl py-3 rounded-xl transition duration-150" data-action="operator">+</button>

            <!-- Fifth Row -->
            <button class="calc-btn col-span-2 bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">0</button>
            <button class="calc-btn bg-gray-50 hover:bg-gray-100 font-semibold text-xl py-3 rounded-xl transition duration-150 shadow-sm" data-action="number">.</button>
            <button class="calc-btn bg-indigo-600 text-white hover:bg-indigo-700 font-bold text-xl py-3 rounded-xl transition duration-150 shadow-md" data-action="calculate">=</button>
        </div>
    </div>

    <script>
        // using namespace std;

        // Select the display elements
        const currentOperandTextElement = document.getElementById('current-operand');
        const previousOperandTextElement = document.getElementById('previous-operand');
        
        // Calculator state variables
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        // Update the visual display
        function updateDisplay() {
            currentOperandTextElement.innerText = currentOperand;
            if (operation != null) {
                // Show the chosen operation symbol
                previousOperandTextElement.innerText = `${previousOperand} ${operation}`;
            } else {
                previousOperandTextElement.innerText = '';
            }
        }

        // Handle appending numbers and the decimal point
        function appendNumber(number) {
            // Prevent multiple decimals
            if (number === '.' && currentOperand.includes('.')) return;
            // Handle replacing the initial 0
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
        }

        // Handle operator selection
        function chooseOperation(op) {
            if (currentOperand === '') return;
            // If there's already an operation pending, calculate it first
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
        }

        // Perform the calculation based on the selected operator
        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            
            // Validate inputs
            if (isNaN(prev) || isNaN(current)) return;

            // Perform the arithmetic
            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    // Basic division by zero handling
                    if (current === 0) {
                        alert("Cannot divide by zero");
                        clearDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }
            currentOperand = computation.toString();
            operation = undefined;
            previousOperand = '';
        }

        // Reset the calculator state
        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
        }

        // Attach event listeners to all buttons based on their data-action attribute
        const buttons = document.querySelectorAll('.calc-btn');
        
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                const value = button.innerText;

                if (action === 'number') {
                    appendNumber(value);
                    updateDisplay();
                } 
                else if (action === 'operator') {
                    chooseOperation(value);
                    updateDisplay();
                } 
                else if (action === 'calculate') {
                    compute();
                    updateDisplay();
                } 
                else if (action === 'clear') {
                    clearDisplay();
                    updateDisplay();
                }
            });
        });
        
        // Initialize the display on load
        updateDisplay();
    </script>
</body>
</html>
